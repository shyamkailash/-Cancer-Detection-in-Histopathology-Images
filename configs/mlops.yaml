mlflow:
  enabled: false
  tracking_uri: "artifacts/mlflow"
  experiment_name: "pcam_cancer_detection"

drift:
  method: "psi"
  threshold: 0.10
  warning_threshold: 0.10
  critical_threshold: 0.25
  min_samples: 50

registry:
  min_accuracy: 0.90
  min_roc_auc: 0.90
  min_sensitivity: 0.80
  require_checkpoint_exists: true

privacy:
  enabled: false
  strategy: "none"
  clipping_norm: 1.0
  noise_multiplier: 1.0
  delta: 1e-5
  accountant: "rdp"

retraining:
  enabled: true
  dry_run: true
  min_samples_since_retrain: 500
  cooldown_seconds: 3600

orchestrator:
  dry_run: true
  max_retries: 3
  timeout_seconds: 300
