name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cancer_detection_test
          POSTGRES_USER: cancer_user_test
          POSTGRES_PASSWORD: cancer_password_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: cancer_detection_test
      POSTGRES_USER: cancer_user_test
      POSTGRES_PASSWORD: cancer_password_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      DEBUG: "False"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Django system checks
        working-directory: ./backend
        run: python manage.py check --deploy

      - name: Run database migrations
        working-directory: ./backend
        run: python manage.py migrate --noinput

      - name: Run tests with pytest
        working-directory: .
        run: pytest -v --tb=short

      - name: Run tests with coverage
        working-directory: .
        run: pytest --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml
        if: always()