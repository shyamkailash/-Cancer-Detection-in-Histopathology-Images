version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cancer_detection_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cancer_detection}
      POSTGRES_USER: ${POSTGRES_USER:-cancer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cancer_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cancer_user} -d ${POSTGRES_DB:-cancer_detection}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cancer_detection_web
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - DJANGO_SETTINGS_MODULE=config.settings.production
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

volumes:
  postgres_data: