name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cancer_detection_test
          POSTGRES_USER: cancer_user_test
          POSTGRES_PASSWORD: cancer_password_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U cancer_user_test -d cancer_detection_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: cancer_detection_test
      POSTGRES_USER: cancer_user_test
      POSTGRES_PASSWORD: cancer_password_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-test-secret-key-do-not-use-in-production
      DEBUG: "False"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt

      - name: Diagnose ML package imports
        run: |
          python --version
          python -m pip check
          python -c "import ml; print('ml package:', ml.__file__)"
          python -c "import ml.datasets; print('ml.datasets:', ml.datasets.__file__)"
          python -c "import ml.datasets.dataloaders as d; print('dataloaders:', d.__file__)"

      - name: Compile Python packages
        run: |
          python -m compileall -q ml backend agents mlops scripts tests

      - name: Run Django system checks
        working-directory: backend
        run: |
          python manage.py check --settings=config.settings.test
          python manage.py check --settings=config.settings.development

      - name: Create synthetic checkpoints for CI tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import torch

          from ml.inference.model_manager import MODEL_REGISTRY_CONFIG, PROJECT_ROOT
          from ml.models.resnet import create_resnet18

          # TEST FIXTURES ONLY. These random weights are not trained models
          # and must never be used for real cancer predictions or evaluation.
          model = create_resnet18(num_classes=2, pretrained=False)
          checkpoint = {
              "model_state_dict": model.state_dict(),
              "ci_synthetic": True,
          }

          paths = set()

          for config in MODEL_REGISTRY_CONFIG.values():
              for key in ("default_checkpoint", "fallback_checkpoint"):
                  relative_path = config.get(key)
                  if relative_path:
                      paths.add((PROJECT_ROOT / relative_path).resolve())

          if not paths:
              raise RuntimeError(
                  "No checkpoint paths found in MODEL_REGISTRY_CONFIG."
              )

          for path in sorted(paths):
              path.parent.mkdir(parents=True, exist_ok=True)
              torch.save(checkpoint, path)
              print(f"Created CI-only synthetic checkpoint: {path}")

          print(f"Created {len(paths)} synthetic checkpoint file(s).")
          PY

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests and collect coverage
        run: |
          pytest -v --tb=short \
            --cov=backend \
            --cov=ml \
            --cov=agents \
            --cov=mlops \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml
          if-no-files-found: ignore